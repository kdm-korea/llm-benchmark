[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Reproducible LLM and legal RAG research benchmarks"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
embedding = [
  "numpy>=2.0,<3",
  "PyYAML>=6,<7",
  "huggingface-hub>=0.34,<3",
  "sentence-transformers>=5,<7",
  "mteb==2.26.11",
]
koblex = ["pyarrow>=21,<27"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
embedding-benchmark = "llm_benchmark.embedding.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_benchmark"]

[tool.mypy]
files = ["src/llm_benchmark/koblex"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
cache_dir = "cache/mypy"
