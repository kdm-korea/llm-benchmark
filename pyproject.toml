[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Reproducible LLM and legal RAG research benchmarks"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
embedding = [
  "numpy>=2.0,<3",
  "PyYAML>=6,<7",
  "huggingface-hub>=0.34,<3",
  "sentence-transformers>=5,<7",
  "mteb==2.26.11",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
embedding-benchmark = "llm_benchmark.embedding.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_benchmark"]

[tool.mypy]
cache_dir = "cache/mypy"
files = ["src/llm_benchmark"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["yaml", "sentence_transformers.*", "mteb.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "cache/ruff"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
